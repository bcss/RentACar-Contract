<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Entry Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
        select.form-input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/60 p-4">
<div class="relative w-full max-w-lg rounded-xl bg-background-light dark:bg-background-dark shadow-2xl">
<div class="flex items-start justify-between p-6 border-b border-gray-200 dark:border-gray-700">
<div class="flex flex-col">
<h1 class="text-xl font-bold text-gray-900 dark:text-white">Record Payment</h1>
<p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Contract ID: C-123456 | Customer: John Doe</p>
</div>
<button class="p-1 rounded-full text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-white" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="p-6">
<form action="#" class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-5">
<div class="sm:col-span-2">
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Amount</p>
<div class="relative">
<span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 dark:text-gray-400">$</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] pl-7 text-base font-normal leading-normal" placeholder="0.00" type="number" value="250.00"/>
</div>
</label>
</div>
<div class="sm:col-span-1">
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Payment Type</p>
<select class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:border-primary h-12 bg-[image:--select-button-svg] p-[15px] text-base font-normal leading-normal" style="--select-button-svg: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27rgb(156, 163, 175)%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e');">
<option>Payment</option>
<option>Deposit</option>
<option>Refund</option>
<option>Excess</option>
</select>
</label>
</div>
<div class="sm:col-span-1">
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Payment Method</p>
<select class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:border-primary h-12 bg-[image:--select-button-svg] p-[15px] text-base font-normal leading-normal" style="--select-button-svg: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27rgb(156, 163, 175)%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e');">
<option>Credit Card</option>
<option>Bank Transfer</option>
<option>Cash</option>
<option>Online Payment</option>
</select>
</label>
</div>
<div class="sm:col-span-2">
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Reference / Note</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="e.g., Transaction ID" value="CC-TRX-987654"/>
</label>
</div>
<div class="sm:col-span-2">
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Value Date</p>
<div class="relative flex w-full flex-1 items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal pr-10" type="date" value="2023-10-27"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 dark:text-gray-400" data-icon="Calendar" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</label>
</div>
</form>
</div>
<div class="flex items-center justify-end gap-4 p-6 border-t border-gray-200 dark:border-gray-700">
<button class="px-5 py-2.5 text-sm font-semibold rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200" type="button">Cancel</button>
<button class="px-5 py-2.5 text-sm font-semibold rounded-lg bg-primary text-white hover:bg-primary/90 focus:ring-4 focus:ring-primary/40" type="submit">Confirm Payment</button>
</div>
</div>
</div>
</body></html>
