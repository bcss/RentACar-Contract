<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unified Dark Fields Theme</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center">
  <main class="w-full max-w-xl bg-white rounded-2xl shadow-sm p-8">
    <h1 class="text-lg font-semibold text-slate-900 mb-6">
      Unified Dark Input Theme
    </h1>

    <!-- USERNAME -->
    <div class="group flex items-center gap-3 border-b border-slate-200 pb-2 mb-6">
      <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8"
        viewBox="0 0 24 24">
        <path d="M5.121 17.804A9 9 0 1118.88 17.8 7 7 0 0012 15a7 7 0 00-6.879 2.804z"/>
        <path d="M15 9a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>

      <input type="text" placeholder="Username"
        class="flex-1 bg-transparent outline-none text-sm text-slate-900 placeholder:text-slate-500" />
    </div>

    <!-- PASSWORD -->
    <div class="group flex items-center gap-3 border-b border-slate-200 pb-2 mb-10">
      <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8"
        viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
        <path d="M8 11V8a4 4 0 118 0v3" />
      </svg>

      <input id="password" type="password" placeholder="Password"
        class="flex-1 bg-transparent outline-none text-sm text-slate-900 placeholder:text-slate-500" />

      <button type="button" id="togglePassword" class="text-slate-400 hover:text-slate-600">
        <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8"
          viewBox="0 0 24 24">
          <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <!-- EMAIL -->
    <div class="group flex items-center gap-3 border-b border-slate-200 pb-2 mb-6">
      <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8"
        viewBox="0 0 24 24">
        <path d="M4 6h16v12H4z" />
        <path d="M4 7l8 5 8-5" />
      </svg>

      <input type="email" placeholder="Email"
        class="flex-1 bg-transparent outline-none text-sm text-slate-900 placeholder:text-slate-500" />
    </div>

    <!-- PHONE -->
    <div class="group flex items-center gap-3 border-b border-slate-200 pb-2 mb-6">
      <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8"
        viewBox="0 0 24 24">
        <path d="M5 4h3l2 4-2.5 1.5A11 11 0 0014 18.5L15.5 16l4 2v3a2 2 0 01-2 2A15 15 0 015 6a2 2 0 012-2z" />
      </svg>

      <input type="tel" placeholder="Phone"
        class="flex-1 bg-transparent outline-none text-sm text-slate-900 placeholder:text-slate-500" />
    </div>

    <!-- DATE -->
    <div class="group flex items-center gap-3 border-b border-slate-200 pb-2 mb-6">
      <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8"
        viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="17" rx="2" />
        <path d="M8 2v4M16 2v4M3 10h18" />
      </svg>

      <input type="date"
        class="flex-1 bg-transparent outline-none text-sm text-slate-900 [color-scheme:light]" />
    </div>

    <!-- SELECT -->
    <div class="group flex items-center gap-3 border-b border-slate-200 pb-2 mb-6">
      <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8"
        viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15A7.96 7.96 0 0120 12a8 8 0 10-8 8" />
      </svg>

      <select
        class="flex-1 bg-transparent outline-none text-sm text-slate-900 appearance-none">
        <option disabled selected class="text-slate-500">Select role</option>
        <option>User</option>
        <option>Admin</option>
        <option>Manager</option>
      </select>
    </div>

    <!-- TEXTAREA -->
    <div class="border-b border-slate-200 pb-2">
      <div class="flex items-center gap-3 mb-1">
        <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8"
          viewBox="0 0 24 24">
          <path d="M4 4h16v16H4z" />
          <path d="M8 8h8M8 12h5M8 16h3" />
        </svg>
        <span class="text-sm text-slate-500">Notes</span>
      </div>

      <textarea rows="2"
        class="w-full bg-transparent outline-none text-sm text-slate-900 placeholder:text-slate-500 resize-none"
        placeholder="Additional notes"></textarea>
    </div>

  </main>

  <script>
    // Password visibility toggle
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePasswordBtn.addEventListener("click", () => {
      const hidden = passwordInput.type === "password";
      passwordInput.type = hidden ? "text" : "password";

      if (hidden) {
        eyeIcon.innerHTML =
          '<path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.58 10.58A3 3 0 0113.42 13.4M9.88 9.88a3 3 0 014.24 4.24M9.88 9.88L9.17 9.17M14.83 14.83L14.12 14.12M6.1 6.1C4.54 7.24 3.27 8.94 2.46 11c1.47 3.89 4.97 6.5 9.54 6.5 1.35 0 2.63-.24 3.8-.7M17.9 17.9C19.46 16.76 20.73 15.06 21.54 13c-.86-2.3-2.5-4.1-4.54-5.21"/>';
      } else {
        eyeIcon.innerHTML =
          '<path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/><circle cx="12" cy="12" r="3"></circle>';
      }
    });
  </script>
</body>
</html>
